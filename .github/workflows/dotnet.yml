# Builds and tests Loki Bulk Data Processor.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Unit tests
      run: dotnet test LokiBulkDataProcessor.UnitTests -c Release --verbosity normal
    - name: Build the solution, including the samples, and run the samples' tests
      # samples/ is in the solution and references the libraries' code, so an API change that breaks a sample fails here.
      # The samples are never run against a database in CI.
      run: |
        dotnet build LokiBulkDataProcessor.sln -c Release
        dotnet test samples/Loki.Samples.WebApi.Tests -c Release --no-build --verbosity normal
    - name: Samples docker-compose file is valid and uses the integration tests' images
      run: |
        docker compose -f samples/docker-compose.yml config --quiet
        sqlserver=$(grep -oP '"\Kmcr\.microsoft\.com/mssql/server:[^"]+' LokiBulkDataProcessor.IntegrationTests/SqlServer/SqlServerTestDatabase.cs || true)
        oracle=$(grep -oP 'const string Image = "\K[^"]+' LokiBulkDataProcessor.Oracle.IntegrationTests/OracleTestDatabase.cs || true)
        for image in "$sqlserver" "$oracle"; do
          if [[ -z "$image" ]] || ! grep -qF "image: $image" samples/docker-compose.yml; then
            echo "::error::samples/docker-compose.yml must use the integration tests' image '$image'"
            exit 1
          fi
        done
    - name: Libraries have no test-only packages in their dependency graph (#17)
      # Direct and transitive: Testcontainers, NUnit, Moq, FluentAssertions, Microsoft.NET.Test.Sdk and coverlet must never
      # flow to consumers. The pack job checks the packed nuspecs as well.
      run: |
        for p in LokiBulkDataProcessor.Core LokiBulkDataProcessor LokiBulkDataProcessor.Oracle; do
          dotnet list $p package --include-transitive > packages.txt
          cat packages.txt
          if grep -iE '>\s+(testcontainers|nunit|moq|fluentassertions|microsoft\.net\.test\.sdk|coverlet)[^ ]*\s' packages.txt; then
            echo "::error::A test-only package (listed above) must not be a dependency of the $p package"
            exit 1
          fi
        done
    - name: Libraries and samples have no known vulnerable packages, direct or transitive
      # Fails on any advisory NuGet reports for a package the libraries ship with (e.g. the Oracle driver's transitive
      # 8.0.x System.* packages), so a new advisory is caught on the next build. The samples are checked too, because people
      # copy them; the library test projects are not checked here.
      run: |
        failed=0
        for p in LokiBulkDataProcessor.Core LokiBulkDataProcessor LokiBulkDataProcessor.Oracle \
                 samples/Loki.Samples.WebApi samples/Loki.Samples.WebApi.Tests samples/Loki.Samples.Benchmark; do
          dotnet list $p package --vulnerable --include-transitive > vulnerable.txt
          cat vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::$p has a dependency with a known vulnerability; see the list above"
            failed=1
          fi
        done
        exit $failed

  sqlserver-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: SQL Server test image is digest-pinned
      # Like the Oracle image: a re-pushed tag must fail instead of silently changing the database under the tests.
      run: |
        if ! grep -qP 'mcr\.microsoft\.com/mssql/server:[^"@]+@sha256:[0-9a-f]{64}"' LokiBulkDataProcessor.IntegrationTests/SqlServer/SqlServerTestDatabase.cs; then
          echo "::error::SqlServerTestDatabase.Image must be a tag + digest pinned image reference"
          exit 1
        fi
    - name: SQL Server integration tests
      run: dotnet test LokiBulkDataProcessor.IntegrationTests -c Release --verbosity normal

  oracle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Pull the Oracle image
      # The image (tag + digest) has one source: the OracleTestDatabase.Image constant. Pulled up front so the ~1.3 GB download
      # is not part of the test run; fails if the constant cannot be read or is not digest-pinned.
      run: |
        image=$(grep -oP 'const string Image = "\K[^"]+' LokiBulkDataProcessor.Oracle.IntegrationTests/OracleTestDatabase.cs)
        if [[ "$image" != *@sha256:* ]]; then
          echo "::error::OracleTestDatabase.Image must be a digest-pinned image reference (found '$image')"
          exit 1
        fi
        docker pull "$image"
    - name: Oracle integration tests
      run: dotnet test LokiBulkDataProcessor.Oracle.IntegrationTests -c Release --verbosity normal --blame-hang-timeout 10m

  pack:
    # Packs the three libraries and checks the packages (version, Core dependency range, no test-only dependencies,
    # XML docs and README included); see build/pack.sh. Uploads them as a workflow artifact on pushes. Never publishes to NuGet.
    needs: unit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Pack and check the packages
      run: bash build/pack.sh artifacts/packages
    - name: Package checksums
      run: sha256sum artifacts/packages/*.nupkg
    - name: Upload the packages
      # Only from pushes (never from pull requests), so an uploaded artifact always comes from a commit on a protected
      # branch. Publish only from a push run at the tagged release commit; see the owner checklist in docs/plans/9.0.0-progress.md.
      if: github.event_name == 'push'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: nuget-packages
        path: artifacts/packages/*.nupkg
        if-no-files-found: error
