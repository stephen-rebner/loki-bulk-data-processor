# Builds and tests Loki Bulk Data Processor.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Unit tests
      run: dotnet test LokiBulkDataProcessor.UnitTests -c Release --verbosity normal
    - name: Library has no test-only packages in its dependency graph (#17)
      run: |
        dotnet list LokiBulkDataProcessor package --include-transitive > packages.txt
        cat packages.txt
        if grep -i testcontainers packages.txt; then
          echo "::error::Testcontainers must not be a dependency of the LokiBulkDataProcessor package"
          exit 1
        fi

  sqlserver-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: SQL Server integration tests
      run: dotnet test LokiBulkDataProcessor.IntegrationTests -c Release --verbosity normal
