# Builds and tests Loki Bulk Data Processor.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master", "release/**" ]
  pull_request:
    branches: [ "master", "release/**" ]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Unit tests
      run: dotnet test LokiBulkDataProcessor.UnitTests -c Release --verbosity normal
    - name: Libraries have no test-only packages in their dependency graph (#17)
      # Direct and transitive: Testcontainers, NUnit, Moq, FluentAssertions, Microsoft.NET.Test.Sdk and coverlet must never
      # flow to consumers. The pack job checks the packed nuspecs as well.
      run: |
        for p in LokiBulkDataProcessor.Core LokiBulkDataProcessor LokiBulkDataProcessor.Oracle; do
          dotnet list $p package --include-transitive > packages.txt
          cat packages.txt
          if grep -iE '>\s+(testcontainers|nunit|moq|fluentassertions|microsoft\.net\.test\.sdk|coverlet)[^ ]*\s' packages.txt; then
            echo "::error::A test-only package (listed above) must not be a dependency of the $p package"
            exit 1
          fi
        done
    - name: Libraries have no known vulnerable packages, direct or transitive
      # Fails on any advisory NuGet reports for a package the libraries ship with (e.g. the Oracle driver's transitive
      # 8.0.x System.* packages), so a new advisory is caught on the next build. Test projects are not checked here.
      run: |
        failed=0
        for p in LokiBulkDataProcessor.Core LokiBulkDataProcessor LokiBulkDataProcessor.Oracle; do
          dotnet list $p package --vulnerable --include-transitive > vulnerable.txt
          cat vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::$p has a dependency with a known vulnerability; see the list above"
            failed=1
          fi
        done
        exit $failed

  sqlserver-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: SQL Server integration tests
      run: dotnet test LokiBulkDataProcessor.IntegrationTests -c Release --verbosity normal

  oracle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Pull the Oracle image
      # The image (tag + digest) has one source: the OracleTestDatabase.Image constant. Pulled up front so the ~1.3 GB download
      # is not part of the test run; fails if the constant cannot be read or is not digest-pinned.
      run: |
        image=$(grep -oP 'const string Image = "\K[^"]+' LokiBulkDataProcessor.Oracle.IntegrationTests/OracleTestDatabase.cs)
        if [[ "$image" != *@sha256:* ]]; then
          echo "::error::OracleTestDatabase.Image must be a digest-pinned image reference (found '$image')"
          exit 1
        fi
        docker pull "$image"
    - name: Oracle integration tests
      run: dotnet test LokiBulkDataProcessor.Oracle.IntegrationTests -c Release --verbosity normal --blame-hang-timeout 10m

  pack:
    # Packs the three libraries and checks the packages (version, Core dependency range, no test-only dependencies,
    # XML docs and README included); see build/pack.sh. Uploads them as a workflow artifact. Never publishes to NuGet.
    needs: unit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Pack and check the packages
      run: bash build/pack.sh artifacts/packages
    - name: Upload the packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: artifacts/packages/*.nupkg
        if-no-files-found: error
